# Ensures that `Compact` codec changes are backwards compatible.
#
# 1) checkout the original Sila v2.4.0 identity snapshot authority
# 2) randomly generate and serialize to disk many different type vectors with `Compact`
# 3) checkout the Sila PR
# 4) deserialize the baseline Sila-compatible vectors with current Rsil

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"

name: compact-codec
permissions: {}

jobs:
  compact-codec:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - run: .github/scripts/install_llvm.sh ubuntu
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
      - name: Checkout upstream v2.4.0 compatibility authority
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: paradigmxyz/reth
          ref: v2.4.0
          persist-credentials: false
      - name: Generate upstream compact vectors
        run: cargo run --bin reth --features "dev" -- test-vectors compact --write
      - name: Checkout PR
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          clean: false
          persist-credentials: false
      # Read and decode the original Sila snapshot vectors with the current Sila build.
      - name: Read vectors
        run: cargo run --bin rsil --features "dev" -- test-vectors compact --read
