[package]
name = "rsil"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Rsil node implementation"
default-run = "rsil"

[package.metadata.deb]
maintainer = "rsil team"
depends = "$auto"
section = "network"
priority = "optional"
maintainer-scripts = "../../pkg/rsil/debian/"
assets = [
    "$auto",
    ["../../README.md", "usr/share/doc/rsil/", "644"],
    ["../../LICENSE-APACHE", "usr/share/doc/rsil/", "644"],
    ["../../LICENSE-MIT", "usr/share/doc/rsil/", "644"],
    ["../../LICENSES/*", "usr/share/doc/rsil/LICENSES/", "644"],
]
systemd-units = { enable = false, start = false, unit-name = "rsil", unit-scripts = "../../pkg/rsil/debian" }

[lints]
workspace = true

[dependencies]
# rsil
rsil-sila-cli.workspace = true
rsil-chainspec.workspace = true
rsil-primitives-traits.workspace = true
rsil-sila-primitives.workspace = true
rsil-db = { workspace = true, features = ["mdbx"] }
rsil-provider.workspace = true
rsil-revm.workspace = true
rsil-transaction-pool.workspace = true
rsil-cli-runner.workspace = true
rsil-cli-util.workspace = true
rsil-consensus-common.workspace = true
rsil-rpc-builder.workspace = true
rsil-rpc.workspace = true
rsil-rpc-convert.workspace = true
rsil-rpc-api = { workspace = true, features = ["client"] }
rsil-rpc-sil-types.workspace = true
rsil-rpc-server-types.workspace = true
rsil-network = { workspace = true, features = ["serde"] }
rsil-network-api.workspace = true
rsil-tasks.workspace = true
rsil-payload-builder.workspace = true
rsil-payload-primitives.workspace = true
rsil-node-api.workspace = true
rsil-node-core.workspace = true
rsil-sila-payload-builder.workspace = true
rsil-node-sila.workspace = true
rsil-node-builder.workspace = true
rsil-node-metrics.workspace = true
rsil-consensus.workspace = true

# alloy
alloy-primitives.workspace = true
alloy-rpc-types = { workspace = true, features = ["engine"] }

# tracing
tracing.workspace = true

# misc
aquamarine.workspace = true
clap = { workspace = true, features = ["derive", "env"] }

[dev-dependencies]
alloy-node-bindings = "2.1.1"
alloy-provider = { workspace = true, features = ["reqwest"] }
alloy-rpc-types-sil.workspace = true
backon.workspace = true
serde_json.workspace = true
tar.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
toml.workspace = true
zstd.workspace = true

[features]
default = [
    "jemalloc",
    "otlp",
    "otlp-logs",
    "rsil-revm/portable",
    "js-tracer",
    "jit",
    "keccak-cache-global",
    "asm-keccak",
    "gmp",
    "min-trace-logs",
]

jit = [
    "rsil-sila-cli/jit",
    "rsil-node-sila/jit",
]
gmp = [
    "rsil-sila-cli/gmp",
    "rsil-node-sila/gmp",
    "rsil-revm/gmp",
]

otlp = [
    "rsil-sila-cli/otlp",
    "rsil-node-core/otlp",
]
otlp-logs = [
    "rsil-sila-cli/otlp-logs",
    "rsil-node-core/otlp-logs",
]
js-tracer = [
    "rsil-node-builder/js-tracer",
    "rsil-node-sila/js-tracer",
    "rsil-rpc/js-tracer",
    "rsil-rpc-sil-types/js-tracer",
]

dev = ["rsil-sila-cli/dev"]

asm-keccak = [
    "rsil-node-core/asm-keccak",
    "rsil-sila-cli/asm-keccak",
    "rsil-node-sila/asm-keccak",
    "alloy-primitives/asm-keccak",
]
keccak-cache-global = [
    "rsil-node-core/keccak-cache-global",
    "rsil-node-sila/keccak-cache-global",
    "alloy-primitives/keccak-cache-global",
]
jemalloc = [
    "rsil-cli-util/jemalloc",
    "rsil-node-core/jemalloc",
    "rsil-node-metrics/jemalloc",
    "rsil-sila-cli/jemalloc",
    "rsil-provider/jemalloc",
]
jemalloc-prof = [
    "jemalloc",
    "rsil-cli-util/jemalloc-prof",
    "rsil-sila-cli/jemalloc-prof",
    "rsil-node-metrics/jemalloc-prof",
]
jemalloc-symbols = [
    "jemalloc-prof",
    "rsil-sila-cli/jemalloc-symbols",
]
tracy-allocator = [
    "rsil-cli-util/tracy-allocator",
    "rsil-sila-cli/tracy-allocator",
    "tracy",
]
tracy = [
    "rsil-sila-cli/tracy",
    "rsil-node-core/tracy",
]

# Because jemalloc is default and preferred over snmalloc when both features are
# enabled, `--no-default-features` should be used when enabling snmalloc or
# snmalloc-native.
snmalloc = [
    "rsil-cli-util/snmalloc",
    "rsil-sila-cli/snmalloc",
]
snmalloc-native = [
    "rsil-cli-util/snmalloc-native",
    "rsil-sila-cli/snmalloc-native",
]

min-error-logs = [
    "tracing/release_max_level_error",
    "rsil-sila-cli/min-error-logs",
    "rsil-node-core/min-error-logs",
]
min-warn-logs = [
    "tracing/release_max_level_warn",
    "rsil-sila-cli/min-warn-logs",
    "rsil-node-core/min-warn-logs",
]
min-info-logs = [
    "tracing/release_max_level_info",
    "rsil-sila-cli/min-info-logs",
    "rsil-node-core/min-info-logs",
]
min-debug-logs = [
    "tracing/release_max_level_debug",
    "rsil-sila-cli/min-debug-logs",
    "rsil-node-core/min-debug-logs",
]
min-trace-logs = [
    "tracing/release_max_level_trace",
    "rsil-sila-cli/min-trace-logs",
    "rsil-node-core/min-trace-logs",
]

trie-debug = ["rsil-node-builder/trie-debug", "rsil-node-core/trie-debug"]

[[bin]]
name = "rsil"
path = "src/main.rs"
