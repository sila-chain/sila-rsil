[package]
name = "rsil-engine-primitives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# rsil
rsil-savm = { workspace = true, optional = true }
rsil-execution-errors.workspace = true
rsil-execution-types.workspace = true
rsil-payload-primitives.workspace = true
rsil-payload-builder-primitives = { workspace = true, optional = true }
rsil-primitives-traits.workspace = true
rsil-sila-primitives.workspace = true
rsil-chain-state.workspace = true
rsil-errors.workspace = true
rsil-trie-common.workspace = true
rsil-storage-api.workspace = true

# alloy
alloy-primitives.workspace = true
alloy-consensus.workspace = true
alloy-rpc-types-engine.workspace = true
alloy-sips.workspace = true

# async
tokio = { workspace = true, features = ["sync"], optional = true }
futures = { workspace = true, optional = true }

# misc
auto_impl.workspace = true
serde.workspace = true
thiserror.workspace = true

[features]
default = ["std"]
trie-debug = []
std = [
    "dep:rsil-savm",
    "dep:rsil-payload-builder-primitives",
    "rsil-execution-errors/std",
    "rsil-execution-types/std",
    "rsil-sila-primitives/std",
    "rsil-primitives-traits/std",
    "rsil-trie-common/std",
    "rsil-storage-api/std",
    "alloy-primitives/std",
    "alloy-consensus/std",
    "alloy-rpc-types-engine/std",
    "alloy-sips/std",
    "futures/std",
    "tokio",
    "serde/std",
    "thiserror/std",
    "rsil-savm?/std",
]
