[package]
name = "rsil-exex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Execution extensions for Rsil"

[lints]
workspace = true

[dependencies]
## rsil
rsil-chain-state.workspace = true
rsil-chainspec.workspace = true
rsil-config.workspace = true
rsil-savm.workspace = true
rsil-exex-types = { workspace = true, features = ["serde", "serde-bincode-compat"] }
rsil-fs-util.workspace = true
rsil-metrics.workspace = true
rsil-node-api.workspace = true
rsil-node-core.workspace = true
rsil-primitives-traits.workspace = true
rsil-sila-primitives.workspace = true
rsil-provider.workspace = true
rsil-prune-types.workspace = true
rsil-revm.workspace = true
rsil-stages-api.workspace = true
rsil-tasks.workspace = true
rsil-tracing.workspace = true
rsil-payload-builder.workspace = true

# alloy
alloy-consensus.workspace = true
alloy-primitives.workspace = true
alloy-sips.workspace = true

## async
futures.workspace = true
tokio-util.workspace = true
tokio.workspace = true

## misc
eyre.workspace = true
itertools = { workspace = true, features = ["use_std"] }
metrics.workspace = true
parking_lot.workspace = true
rmp-serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
rsil-db-common.workspace = true
rsil-savm-sila.workspace = true
rsil-primitives-traits = { workspace = true, features = ["test-utils"] }
rsil-provider = { workspace = true, features = ["test-utils"] }
rsil-testing-utils.workspace = true
rsil-trie-common = { workspace = true, features = ["serde-bincode-compat"] }

alloy-genesis.workspace = true

rand.workspace = true
secp256k1.workspace = true
tempfile.workspace = true

[features]
serde = [
    "rsil-exex-types/serde",
    "rsil-revm/serde",
    "alloy-consensus/serde",
    "alloy-sips/serde",
    "alloy-primitives/serde",
    "parking_lot/serde",
    "rand/serde",
    "secp256k1/serde",
    "rsil-primitives-traits/serde",
    "rsil-trie-common/serde",
    "rsil-prune-types/serde",
    "rsil-config/serde",
    "rsil-sila-primitives/serde",
    "rsil-chain-state/serde",
]
