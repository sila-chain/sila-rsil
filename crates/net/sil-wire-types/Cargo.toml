[package]
name = "rsil-sil-wire-types"
description = "types for sil-wire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# rsil
rsil-chainspec.workspace = true
rsil-codecs-derive.workspace = true
rsil-sila-primitives.workspace = true
rsil-primitives-traits.workspace = true

# sila
alloy-chains = { workspace = true, features = ["rlp"] }
alloy-sip7928 = { workspace = true, features = ["rlp"], optional = true }
alloy-sips.workspace = true
alloy-primitives = { workspace = true, features = ["map"] }
alloy-rlp = { workspace = true, features = ["derive"] }
alloy-consensus.workspace = true

bytes.workspace = true
derive_more.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true

# arbitrary utils
arbitrary = { workspace = true, features = ["derive"], optional = true }
proptest = { workspace = true, optional = true }
proptest-arbitrary-interop = { workspace = true, optional = true }
alloy-hardforks.workspace = true

[dev-dependencies]
rsil-sila-primitives = { workspace = true, features = ["arbitrary"] }
alloy-primitives = { workspace = true, features = ["arbitrary", "rand"] }
alloy-consensus = { workspace = true, features = ["arbitrary"] }
alloy-sip7928 = { workspace = true, features = ["arbitrary", "rlp"] }
alloy-sips = { workspace = true, features = ["arbitrary"] }
alloy-genesis.workspace = true
alloy-chains = { workspace = true, features = ["arbitrary"] }
arbitrary = { workspace = true, features = ["derive"] }
proptest.workspace = true
proptest-arbitrary-interop.workspace = true
rand.workspace = true
test-case.workspace = true

[features]
default = ["std"]
std = [
    "alloy-chains/std",
    "alloy-consensus/std",
    "alloy-sip7928?/std",
    "alloy-sips/std",
    "alloy-genesis/std",
    "alloy-primitives/std",
    "alloy-rlp/std",
    "bytes/std",
    "derive_more/std",
    "rsil-sila-primitives/std",
    "rsil-primitives-traits/std",
    "serde?/std",
    "thiserror/std",
    "rsil-chainspec/std",
]
arbitrary = [
    "rsil-sila-primitives/arbitrary",
    "alloy-chains/arbitrary",
    "dep:alloy-sip7928",
    "alloy-sip7928/arbitrary",
    "dep:arbitrary",
    "dep:proptest",
    "dep:proptest-arbitrary-interop",
    "rsil-chainspec/arbitrary",
    "alloy-consensus/arbitrary",
    "alloy-sips/arbitrary",
    "alloy-primitives/arbitrary",
    "rsil-primitives-traits/arbitrary",
]
serde = [
    "dep:serde",
    "alloy-chains/serde",
    "alloy-consensus/serde",
    "alloy-sips/serde",
    "alloy-primitives/serde",
    "bytes/serde",
    "rand/serde",
    "rsil-primitives-traits/serde",
    "rsil-sila-primitives/serde",
    "alloy-hardforks/serde",
    "alloy-sip7928?/serde",
]
