[package]
name = "rsil-node-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# rsil
rsil-chainspec.workspace = true
rsil-consensus.workspace = true
rsil-primitives-traits = { workspace = true, features = ["rayon"] }
rsil-cli-util.workspace = true
rsil-db = { workspace = true, features = ["mdbx"] }
rsil-storage-errors.workspace = true
rsil-storage-api = { workspace = true, features = ["std", "db-api"] }
rsil-network = { workspace = true, features = ["serde"] }
rsil-network-p2p.workspace = true
rsil-rpc-sil-types.workspace = true
rsil-rpc-server-types.workspace = true
rsil-rpc-convert.workspace = true
rsil-transaction-pool.workspace = true
rsil-tasks.workspace = true
rsil-tracing = { workspace = true, features = ["std"] }
rsil-config = { workspace = true, features = ["serde"] }
rsil-discv4.workspace = true
rsil-discv5.workspace = true
rsil-net-nat.workspace = true
rsil-net-banlist.workspace = true
rsil-network-peers.workspace = true
rsil-prune-types.workspace = true
rsil-stages-types.workspace = true
rsil-sila-forks.workspace = true
rsil-engine-local.workspace = true
rsil-engine-primitives.workspace = true

# sila
alloy-primitives.workspace = true
alloy-rpc-types-engine = { workspace = true, features = ["std", "jwt-aws-lc-rs"] }
alloy-consensus.workspace = true
alloy-sips.workspace = true

# misc
eyre.workspace = true
clap = { workspace = true, features = ["derive", "env", "string"] }
humantime.workspace = true
rand.workspace = true
derive_more.workspace = true
toml.workspace = true
serde.workspace = true
strum = { workspace = true, features = ["derive"] }
thiserror.workspace = true
url.workspace = true
ipnet.workspace = true
# io
dirs-next.workspace = true

# obs
tracing.workspace = true
rsil-tracing-otlp.workspace = true

# crypto
secp256k1 = { workspace = true, features = ["global-context", "std", "recovery"] }

# async
futures.workspace = true

[dev-dependencies]
# test vectors generation
proptest.workspace = true
tokio.workspace = true

[features]
# Features for vergen to generate correct env vars
jemalloc = ["rsil-cli-util/jemalloc"]
asm-keccak = ["alloy-primitives/asm-keccak"]
keccak-cache-global = ["alloy-primitives/keccak-cache-global"]
otlp = ["rsil-tracing/otlp", "rsil-tracing-otlp/otlp"]
otlp-logs = ["rsil-tracing/otlp-logs", "rsil-tracing-otlp/otlp-logs"]
tracy = ["rsil-tracing/tracy"]

min-error-logs = ["tracing/release_max_level_error"]
min-warn-logs = ["tracing/release_max_level_warn"]
min-info-logs = ["tracing/release_max_level_info"]
min-debug-logs = ["tracing/release_max_level_debug"]
min-trace-logs = ["tracing/release_max_level_trace"]

# Debug recording for sparse trie mutations
trie-debug = ["rsil-engine-primitives/trie-debug"]

[build-dependencies]
vergen = { workspace = true, features = ["build", "cargo", "emit_and_set"] }
vergen-git2.workspace = true
