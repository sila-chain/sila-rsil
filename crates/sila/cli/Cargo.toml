[package]
name = "rsil-sila-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# rsil
rsil-cli.workspace = true
rsil-cli-commands.workspace = true
rsil-cli-runner.workspace = true
rsil-chainspec.workspace = true
rsil-db.workspace = true
rsil-node-builder.workspace = true
rsil-node-core.workspace = true
rsil-node-sila.workspace = true
rsil-node-metrics.workspace = true
rsil-rpc-server-types.workspace = true
rsil-tasks.workspace = true
rsil-tracing.workspace = true
rsil-node-api.workspace = true

# misc
clap.workspace = true
eyre.workspace = true
tracing.workspace = true

[dev-dependencies]
# fs
tempfile.workspace = true

[features]
otlp = ["rsil-tracing/otlp", "rsil-node-core/otlp"]
otlp-logs = ["rsil-tracing/otlp-logs", "rsil-node-core/otlp-logs"]

dev = ["rsil-cli-commands/arbitrary"]

jit = ["rsil-node-sila/jit"]
gmp = ["rsil-node-sila/gmp"]

asm-keccak = [
    "rsil-node-core/asm-keccak",
    "rsil-node-sila/asm-keccak",
]

jemalloc = [
    "rsil-node-core/jemalloc",
    "rsil-node-metrics/jemalloc",
]
jemalloc-prof = [
    "jemalloc",
    "rsil-node-metrics/jemalloc-prof",
]
jemalloc-symbols = [
    "jemalloc-prof",
    "rsil-node-metrics/jemalloc-symbols",
]
tracy-allocator = ["tracy"]
tracy = ["rsil-tracing/tracy", "rsil-node-core/tracy"]

# Because jemalloc is default and preferred over snmalloc when both features are
# enabled, `--no-default-features` should be used when enabling snmalloc or
# snmalloc-native.
snmalloc = []
snmalloc-native = []

min-error-logs = [
    "tracing/release_max_level_error",
    "rsil-node-core/min-error-logs",
]
min-warn-logs = [
    "tracing/release_max_level_warn",
    "rsil-node-core/min-warn-logs",
]
min-info-logs = [
    "tracing/release_max_level_info",
    "rsil-node-core/min-info-logs",
]
min-debug-logs = [
    "tracing/release_max_level_debug",
    "rsil-node-core/min-debug-logs",
]
min-trace-logs = [
    "tracing/release_max_level_trace",
    "rsil-node-core/min-trace-logs",
]
