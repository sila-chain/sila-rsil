[package]
name = "rsil-stages-types"
version.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Commonly used types for stages usage in rsil."

[lints]
workspace = true

[dependencies]
reth-codecs = { version = "0.5.0", default-features = false, optional = true }
rsil-trie-common.workspace = true
alloy-primitives.workspace = true

serde = { workspace = true, optional = true }
arbitrary = { workspace = true, features = ["derive"], optional = true }

bytes = { workspace = true, optional = true }
modular-bitfield = { workspace = true, optional = true }

[dev-dependencies]
reth-codecs = { version = "0.5.0", default-features = false }
rsil-trie-common = { workspace = true, features = ["rsil-codec"] }
alloy-primitives = { workspace = true, features = ["arbitrary", "rand"] }
arbitrary = { workspace = true, features = ["derive"] }
proptest.workspace = true
proptest-arbitrary-interop.workspace = true
rand.workspace = true
bytes.workspace = true
modular-bitfield.workspace = true

[features]
default = ["std"]
std = [
    "alloy-primitives/std",
    "bytes?/std",
    "rsil-trie-common/std",
    "serde?/std",
    "reth-codecs?/std",
]
rsil-codec = [
    "dep:reth-codecs",
    "dep:bytes",
    "dep:modular-bitfield",
    "rsil-trie-common/rsil-codec",
]
test-utils = [
    "arbitrary",
    "reth-codecs?/test-utils",
    "rsil-trie-common/test-utils",
]
arbitrary = [
    "std",
    "dep:arbitrary",
    "alloy-primitives/arbitrary",
    "reth-codecs?/arbitrary",
    "rsil-trie-common/arbitrary",
]
serde = [
    "dep:serde",
    "alloy-primitives/serde",
    "bytes?/serde",
    "rand/serde",
    "reth-codecs?/serde",
    "rsil-trie-common/serde",
]
