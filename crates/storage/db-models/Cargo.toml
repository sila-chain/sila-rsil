[package]
name = "rsil-db-models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Database models used in storage module."

[lints]
workspace = true

[dependencies]
# rsil
reth-codecs = { version = "0.5.0", default-features = false, optional = true }
rsil-primitives-traits.workspace = true

# sila
alloy-primitives.workspace = true
alloy-sips.workspace = true

# codecs
modular-bitfield = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

# misc
bytes = { workspace = true, optional = true }

# arbitrary utils
arbitrary = { workspace = true, features = ["derive"], optional = true }

[dev-dependencies]
# rsil
rsil-primitives-traits = { workspace = true, features = ["arbitrary", "reth-codec"] }
reth-codecs = { version = "0.5.0", default-features = false }

bytes.workspace = true
arbitrary = { workspace = true, features = ["derive"] }

proptest.workspace = true
proptest-arbitrary-interop.workspace = true

[features]
default = ["std"]
std = [
    "alloy-sips/std",
    "alloy-primitives/std",
    "rsil-primitives-traits/std",
    "bytes?/std",
    "serde?/std",
    "reth-codecs?/std",
]
serde = [
    "dep:serde",
    "alloy-sips/serde",
    "alloy-primitives/serde",
    "bytes?/serde",
    "reth-codecs?/serde",
    "rsil-primitives-traits/serde",
]
test-utils = [
    "rsil-primitives-traits/test-utils",
    "arbitrary",
    "reth-codecs?/test-utils",
]
arbitrary = [
    "std",
    "rsil-primitives-traits/arbitrary",
    "dep:arbitrary",
    "alloy-primitives/arbitrary",
    "alloy-sips/arbitrary",
    "reth-codecs?/arbitrary",
]
rsil-codec = [
    "dep:reth-codecs",
    "dep:modular-bitfield",
    "dep:bytes",
    "rsil-primitives-traits/reth-codec",
]
