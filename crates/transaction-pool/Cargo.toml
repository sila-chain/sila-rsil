[package]
name = "rsil-transaction-pool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Transaction pool implementation"

[lints]
workspace = true

[dependencies]
# rsil
rsil-chain-state.workspace = true
rsil-sila-primitives.workspace = true
rsil-chainspec.workspace = true
rsil-sil-wire-types.workspace = true
rsil-savm.workspace = true
rsil-savm-sila.workspace = true
rsil-primitives-traits.workspace = true
rsil-execution-types.workspace = true
rsil-fs-util.workspace = true
rsil-storage-api.workspace = true
rsil-tasks.workspace = true
revm.workspace = true

# sila
alloy-sips = { workspace = true, features = ["kzg"] }
alloy-primitives.workspace = true
alloy-rlp.workspace = true
alloy-consensus = { workspace = true, features = ["kzg"] }

# async/futures
futures-util.workspace = true
parking_lot.workspace = true
pin-project.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-stream.workspace = true

# metrics
rsil-metrics.workspace = true
metrics.workspace = true

# misc
aquamarine.workspace = true
thiserror.workspace = true
tracing.workspace = true
rustc-hash.workspace = true
schnellru.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
bitflags.workspace = true
auto_impl.workspace = true
imbl.workspace = true
smallvec.workspace = true

# testing
rand = { workspace = true, optional = true }
paste = { workspace = true, optional = true }
proptest = { workspace = true, optional = true }
proptest-arbitrary-interop = { workspace = true, optional = true }

[dev-dependencies]
rsil-provider = { workspace = true, features = ["test-utils"] }
rsil-tracing.workspace = true
alloy-primitives = { workspace = true, features = ["rand"] }
paste.workspace = true
rand.workspace = true
proptest.workspace = true
proptest-arbitrary-interop.workspace = true
assert_matches.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
futures.workspace = true
criterion.workspace = true
rsil-transaction-pool = { workspace = true, features = ["test-utils"] }

[features]
serde = [
    "rsil-execution-types/serde",
    "rsil-sil-wire-types/serde",
    "alloy-consensus/serde",
    "alloy-sips/serde",
    "alloy-primitives/serde",
    "bitflags/serde",
    "imbl/serde",
    "parking_lot/serde",
    "rand?/serde",
    "smallvec/serde",
    "rsil-primitives-traits/serde",
    "rsil-sila-primitives/serde",
    "rsil-chain-state/serde",
    "rsil-storage-api/serde",
    "revm/serde",
    "rsil-transaction-pool/serde",
]
test-utils = [
    "rand",
    "paste",
    "serde",
    "rsil-chain-state/test-utils",
    "rsil-chainspec/test-utils",
    "rsil-provider/test-utils",
    "rsil-primitives-traits/test-utils",
    "rsil-sila-primitives/test-utils",
    "alloy-primitives/rand",
    "rsil-savm/test-utils",
    "rsil-savm-sila/test-utils",
    "rsil-tasks/test-utils",
    "rsil-transaction-pool/test-utils",
]
arbitrary = [
    "proptest",
    "proptest-arbitrary-interop",
    "imbl/arbitrary",
    "rsil-chainspec/arbitrary",
    "rsil-sil-wire-types/arbitrary",
    "alloy-consensus/arbitrary",
    "alloy-sips/arbitrary",
    "alloy-primitives/arbitrary",
    "bitflags/arbitrary",
    "rsil-primitives-traits/arbitrary",
    "smallvec/arbitrary",
    "rsil-sila-primitives/arbitrary",
    "revm/arbitrary",
    "imbl/arbitrary",
    "rsil-transaction-pool/arbitrary",
]

[[bench]]
name = "saturated_pool"
harness = false
required-features = ["test-utils"]
