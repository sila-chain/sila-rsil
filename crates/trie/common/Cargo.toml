[package]
name = "rsil-trie-common"
version.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Commonly used types for trie usage in rsil."

[lints]
workspace = true

[dependencies]
# alloy
alloy-primitives.workspace = true
alloy-rlp = { workspace = true, features = ["arrayvec"] }
alloy-trie = { workspace = true, features = ["ethereum"] }
alloy-consensus.workspace = true
rsil-primitives-traits.workspace = true
rsil-codecs = { workspace = true, optional = true }

alloy-rpc-types-sil = { workspace = true, optional = true }
alloy-serde = { workspace = true, optional = true }

arrayvec = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
derive_more.workspace = true
itertools = { workspace = true, features = ["use_alloc"] }
nybbles = { workspace = true, features = ["rlp"] }

# rsil
revm.workspace = true

# `serde` feature
serde = { workspace = true, optional = true }

serde_with = { workspace = true, optional = true }

# `test-utils` feature
hash-db = { workspace = true, optional = true }
plain_hasher = { workspace = true, optional = true }
arbitrary = { workspace = true, features = ["derive"], optional = true }

# misc
rayon = { workspace = true, optional = true }

[dev-dependencies]
rsil-primitives-traits = { workspace = true, features = ["serde"] }
rsil-codecs.workspace = true
alloy-sips.workspace = true
alloy-genesis.workspace = true

alloy-primitives = { workspace = true, features = ["getrandom"] }
alloy-trie = { workspace = true, features = ["arbitrary", "serde"] }
bytes.workspace = true
arrayvec.workspace = true
hash-db.workspace = true
plain_hasher.workspace = true
arbitrary = { workspace = true, features = ["derive"] }
proptest.workspace = true
proptest-arbitrary-interop.workspace = true
bincode.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true

[features]
default = ["std"]
std = [
    "alloy-consensus/std",
    "alloy-genesis/std",
    "alloy-primitives/std",
    "alloy-rlp/std",
    "alloy-rpc-types-sil?/std",
    "alloy-serde?/std",
    "alloy-trie/std",
    "arrayvec?/std",
    "bytes?/std",
    "derive_more/std",
    "nybbles/std",
    "rsil-primitives-traits/std",
    "serde?/std",
    "serde_with?/std",
    "serde_json/std",
    "revm/std",
    "rsil-codecs?/std",
    "alloy-sips/std",
]
sip1186 = ["alloy-rpc-types-sil/serde", "dep:alloy-serde"]
serde = [
    "dep:serde",
    "arrayvec?/serde",
    "bytes?/serde",
    "nybbles/serde",
    "alloy-primitives/serde",
    "alloy-consensus/serde",
    "alloy-trie/serde",
    "alloy-rpc-types-sil?/serde",
    "rsil-primitives-traits/serde",
    "rsil-codecs?/serde",
    "revm/serde",
    "alloy-sips/serde",
]
rsil-codec = ["dep:rsil-codecs", "dep:bytes", "dep:arrayvec"]
serde-bincode-compat = [
    "serde",
    "alloy-consensus/serde-bincode-compat",
    "dep:serde_with",
    "alloy-genesis/serde-bincode-compat",
    "alloy-rpc-types-sil?/serde-bincode-compat",
    "alloy-sips/serde-bincode-compat",
]
test-utils = [
    "dep:plain_hasher",
    "dep:hash-db",
    "arbitrary",
    "rsil-primitives-traits/test-utils",
    "rsil-codecs/test-utils",
]
arbitrary = [
    "std",
    "dep:rsil-codecs",
    "alloy-trie/arbitrary",
    "dep:arbitrary",
    "alloy-serde?/arbitrary",
    "rsil-primitives-traits/arbitrary",
    "alloy-consensus/arbitrary",
    "alloy-primitives/arbitrary",
    "nybbles/arbitrary",
    "rsil-codecs/arbitrary",
    "alloy-rpc-types-sil?/arbitrary",
    "alloy-sips/arbitrary",
    "revm/arbitrary",
]
rayon = ["dep:rayon"]
