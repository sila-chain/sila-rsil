[package]
name = "rsil-trie"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Merkle trie implementation"

[lints]
workspace = true

[dependencies]
# rsil
rsil-execution-errors.workspace = true
rsil-primitives-traits = { workspace = true, features = ["std"] }
rsil-stages-types.workspace = true
rsil-storage-errors.workspace = true
rsil-trie-sparse = { workspace = true, features = ["std"] }
rsil-trie-common = { workspace = true, features = ["rayon"] }

# alloy
alloy-sips.workspace = true
alloy-rlp.workspace = true
alloy-primitives.workspace = true
alloy-consensus.workspace = true
alloy-trie.workspace = true

# tracing
tracing = { workspace = true, features = ["attributes"] }

# misc
auto_impl.workspace = true
itertools.workspace = true

# `metrics` feature
rsil-metrics = { workspace = true, optional = true }
metrics = { workspace = true, optional = true }

# `test-utils` feature
triehash = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }

[dev-dependencies]
# rsil
rsil-primitives-traits = { workspace = true, features = ["test-utils"] }
rsil-tracing.workspace = true
rsil-trie-common = { workspace = true, features = ["test-utils", "arbitrary"] }

# trie
triehash.workspace = true

# misc
assert_matches.workspace = true
criterion.workspace = true
parking_lot.workspace = true
pretty_assertions.workspace = true
proptest-arbitrary-interop.workspace = true
proptest.workspace = true
rand.workspace = true

[features]
metrics = ["rsil-metrics", "dep:metrics"]
serde = [
    "alloy-primitives/serde",
    "alloy-consensus/serde",
    "alloy-trie/serde",
    "alloy-sips/serde",
    "rsil-trie-common/serde",
    "rsil-primitives-traits/serde",
    "alloy-primitives/serde",
    "alloy-consensus/serde",
    "alloy-trie/serde",
    "alloy-sips/serde",
    "rsil-trie-common/serde",
    "rsil-stages-types/serde",
    "parking_lot/serde",
    "rand/serde",
]
test-utils = [
    "triehash",
    "parking_lot",
    "rsil-primitives-traits/test-utils",
    "rsil-trie-common/test-utils",
    "rsil-trie-sparse/test-utils",
    "rsil-stages-types/test-utils",
]
serde-bincode-compat = [
    "alloy-consensus/serde-bincode-compat",
    "alloy-sips/serde-bincode-compat",
    "rsil-trie-common/serde-bincode-compat",
]

[[bench]]
name = "proof_v2"
required-features = ["test-utils"]
harness = false
